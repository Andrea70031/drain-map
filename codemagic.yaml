workflows:
  ios-testflight:
    name: DrainMap iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.andrea70031.drainmap
      vars:
        XCODE_PROJECT: "DrainMap.xcodeproj"
        XCODE_SCHEME: "DrainMap"
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Set unique App Store build number
        script: |
          APP_BUILD_NUMBER=$((100 + ${BUILD_NUMBER:-1}))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_BUILD_NUMBER" DrainMap/Info.plist
          echo "Using CFBundleVersion $APP_BUILD_NUMBER"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
